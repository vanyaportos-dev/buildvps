<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — BUILD VPN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #A7F3D0 0%, #FED7AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 28px; margin-bottom: 24px; color: #1F2937; }
        .info p { margin: 12px 0; color: #1F2937; }
        .info i { width: 24px; color: #10B981; }
        button {
            width: 100%;
            padding: 12px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 50px;
            margin-top: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="glass-card" id="profile">
        <h1><i class="fa-solid fa-user"></i> Личный кабинет</h1>
        <div class="info">
            <p><i class="fa-solid fa-envelope"></i> <strong>Email:</strong> <span id="email">—</span></p>
            <p><i class="fa-solid fa-calendar"></i> <strong>Дата регистрации:</strong> <span id="created">—</span></p>
        </div>
        <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
    </div>
    <script>
        async function loadProfile() {
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'get-profile' })
            });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('email').textContent = data.email;
                document.getElementById('created').textContent = new Date(data.createdAt).toLocaleDateString('ru-RU');
            } else {
                window.location.href = '/login.html';
            }
        }
        function logout() {
            document.cookie = 'build_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 UTC;';
            window.location.href = '/index.html';
        }
        loadProfile();
    </script>
</body>
</html>
