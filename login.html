<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — BUILD VPN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #A7F3D0 0%, #FED7AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1F2937; }
        p { color: #6B7280; margin-bottom: 32px; }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            color: #1F2937;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .btn-google:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }
        .btn-google i { font-size: 20px; }
        .error { color: #EF4444; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1><i class="fa-solid fa-shield-halved"></i> BUILD VPN</h1>
        <p>Войдите, чтобы продолжить</p>
        <a href="/api/auth/google" class="btn-google">
            <i class="fa-brands fa-google"></i> Войти через Google
        </a>
        <div id="error" class="error"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'no_email') {
            document.getElementById('error').textContent = 'Не удалось получить email от Google';
        }
    </script>
</body>
</html>
